version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
      include: scope
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
